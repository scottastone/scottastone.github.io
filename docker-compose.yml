services:
  web:
    build: .
    # The shared proxy (~/docker/websites/proxy) owns ports 80/443 and the
    # Cloudflare certificates, and proxies scottstone.ca to this name.
    container_name: scottstone
    networks:
      - web
    restart: unless-stopped

networks:
  # Shared with the proxy and the other sites (`docker network create web` once).
  web:
    external: true
