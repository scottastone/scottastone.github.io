# Plain HTTP. TLS, certificates and the domain names are handled by the shared
# proxy in front of this container (~/docker/websites/proxy), which reaches it
# as http://scottstone:80 over the "web" Docker network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Old Django URLs
    location = /posts { return 301 /writing/; }
    location ^~ /posts/ { rewrite ^/posts/(.*)$ /writing/$1 permanent; }

    # Astro's fingerprinted assets never change, so cache them forever
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pages, PDFs and everything else: always revalidate so edits show up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
