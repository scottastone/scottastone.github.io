# HTTP: redirect everything to HTTPS
server {
    listen 80;
    server_name scottstone.ca www.scottstone.ca;
    return 301 https://$host$request_uri;
}

# HTTPS: Cloudflare Origin Certificate
server {
    listen 443 ssl;
    http2 on;
    server_name scottstone.ca www.scottstone.ca;

    ssl_certificate     /certs/origin.pem;
    ssl_certificate_key /certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Old Django URLs
    location = /posts { return 301 /writing/; }
    location ^~ /posts/ { rewrite ^/posts/(.*)$ /writing/$1 permanent; }

    # Astro's fingerprinted assets never change, so cache them forever
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pages, PDFs and everything else: always revalidate so edits show up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}

# ---------------------------------------------------------------------------
# pottedpainter.ca and heineart.ca -> the heineart container (github.com/scottastone/heineart.ca)
# It joins the shared "web" Docker network, so nginx reaches it by name.
# ---------------------------------------------------------------------------

# Docker's DNS, so nginx still starts while the heineart container is down.
resolver 127.0.0.11 valid=30s ipv6=off;

# Loaded per connection rather than at startup, so a missing certificate only
# breaks pottedpainter.ca, never scottstone.ca.
# heineart.ca serves the same site, with its own certificate in certs/heineart/.
map $ssl_server_name $pottedpainter_cert {
    ~heineart\.ca$ /certs/heineart/origin.pem;
    default        /certs/pottedpainter/origin.pem;
}
map $ssl_server_name $pottedpainter_key {
    ~heineart\.ca$ /certs/heineart/origin.key;
    default        /certs/pottedpainter/origin.key;
}
# www.<domain> redirects to the bare domain.
map $host $heineart_canonical {
    ~heineart\.ca$ heineart.ca;
    default        pottedpainter.ca;
}

server {
    listen 80;
    server_name pottedpainter.ca www.pottedpainter.ca heineart.ca www.heineart.ca;
    return 301 https://$heineart_canonical$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pottedpainter.ca www.pottedpainter.ca heineart.ca www.heineart.ca;

    ssl_certificate     $pottedpainter_cert;
    ssl_certificate_key $pottedpainter_key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    if ($host != $heineart_canonical) { return 301 https://$heineart_canonical$request_uri; }

    # Photo uploads from the admin page
    client_max_body_size 100M;

    location / {
        set $heineart http://heineart:8090;
        proxy_pass $heineart;
        proxy_http_version 1.1;
        # The admin page uses a long-lived realtime connection.
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
