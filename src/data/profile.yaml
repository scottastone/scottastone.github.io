# Longer "About" paragraph(s). Plain text; a blank line starts a new paragraph.
about: |-
  I'm a data engineer at Covenant Health, where I design and build the databases that turn healthcare data into something clinicians, analysts and decision makers can rely on.

  Before that I earned a PhD in psychology at the University of Alberta, studying human perception and decision making with eye tracking, motion capture and machine learning. That research background still shapes how I work: careful measurement, clean data, and models that hold up in the real world.

